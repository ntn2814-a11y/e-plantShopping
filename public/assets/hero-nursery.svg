      <stop offset="0" stop-color="#133d32"/>
      <stop offset="0.52" stop-color="#4f725e"/>
      <stop offset="1" stop-color="#b5b28f"/>
    </linearGradient>
    <radialGradient id="sun" cx="80%" cy="15%" r="70%">
