<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A lush abstract indoor garden</title>
  <desc id="desc">Layered tropical leaves in deep green tones with warm sunlight.</desc>
  <defs>
